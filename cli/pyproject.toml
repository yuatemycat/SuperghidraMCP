[project]
name = "superghidra-mcp-cli"
version = "0.5.0"
description = "Command-line client for superghidra-mcp server"
authors = [
    { name = "yuatemycat", email = "344623529+yuatemycat@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.2.1",
    "mcp[cli]>=2.0.0,<3",
    "pydantic>=2.0",
]

[project.scripts]
superghidra-mcp-cli = "pyghidra_mcp_cli.main:cli"
pyghidra-mcp-cli = "pyghidra_mcp_cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "aiohttp>=3.9.0",
    "ruff>=0.11.4",
    "pyright>=1.1.0",
    "tomli>=2.0.1",
    "superghidra-mcp>=0.5.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "src/pyghidra_mcp_cli",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/pyghidra_mcp_cli",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.uv.sources]
superghidra-mcp = { path = "..", editable = true }

[tool.ruff.lint]
ignore = ["E402"]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "N",
]
