name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run tests before publishing'
        required: false
        default: 'false'
        type: boolean

jobs:
  ci-gate:
    name: CI Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Lint (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run Pyright Type Checking (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install ghidra-stubs
          pyright src/

      - name: Run unit and fork tests
        run: |
          python -m pytest tests/unit/ tests/test_fork_storage_lifecycle.py tests/test_fork_conflict_resolution.py tests/test_fork_evidence_resolution.py

  wait-for-ci:
    name: Wait for Full CI Matrix
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Wait for peer CI matrix completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/wait_for_ci.py --commit "${{ github.sha }}" --component all --required-workflows "devcontainer across versions,macos smoke,macos compatibility"

  build-and-publish:
    name: Build and Publish Package
    needs: [ci-gate, wait-for-ci]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install build

      - name: Run unit and fork tests
        run: |
          python -m pytest tests/unit/ tests/test_fork_storage_lifecycle.py tests/test_fork_conflict_resolution.py tests/test_fork_evidence_resolution.py

      - name: Build package
        run: python -m build

      - name: Show contents of source distribution
        run: |
          echo "📂 Contents of source distribution archive:"
          tar -tf dist/*.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
