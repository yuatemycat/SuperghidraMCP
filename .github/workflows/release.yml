name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run tests before publishing'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install build

      - name: Run unit and fork tests
        run: |
          python -m pytest tests/unit/ tests/test_fork_storage_lifecycle.py tests/test_fork_conflict_resolution.py tests/test_fork_evidence_resolution.py

      - name: Build package
        run: python -m build

      - name: Show contents of source distribution
        run: |
          echo "📂 Contents of source distribution archive:"
          tar -tf dist/*.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
